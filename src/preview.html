<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>磁力预览</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #1f2329; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  .head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #ffffff; border-bottom: 1px solid #e6e8eb; -webkit-app-region: drag; }
  .title { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .close { -webkit-app-region: no-drag; cursor: pointer; border: none; background: #f0f1f3; border-radius: 6px; width: 26px; height: 26px; font-size: 14px; color: #5a6068; }
  .close:hover { background: #ff5252; color: #fff; }
  .body { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; min-height: 0; }
  .videoWrap { position: relative; flex: 1; min-height: 0; border-radius: 8px; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
  #pwFrame { position: absolute; inset: 0; width: 100%; height: 100%; display: none; background: #000; }
  #pwBuf { position: absolute; left: 0; top: 0; height: 4px; width: 0; background: #3b82f6; transition: width .3s linear; z-index: 5; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select { flex: 1; min-width: 120px; padding: 6px 8px; border: 1px solid #d0d3d8; border-radius: 6px; font-size: 12px; background: #fff; }
  button.act { border: 1px solid #d0d3d8; background: #fff; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button.act:hover { background: #eef4ff; border-color: #7fb2ff; }
  .status { font-size: 12px; color: #5a6068; min-height: 18px; }
  .diag { font-size: 11px; color: #8a9099; background: #eef0f3; border-radius: 6px; padding: 6px 8px; line-height: 1.5; word-break: break-all; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #c4c9d0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <span class="title" id="pwTitle">磁力预览</span>
    <button class="close" id="pwClose" title="关闭">✕</button>
  </div>
  <div class="body">
    <div class="videoWrap">
      <video id="pwVideo" controls></video>
      <canvas id="pwFrame"></canvas>
      <div id="pwBuf"></div>
    </div>
    <div class="row">
      <select id="pwFile" style="display:none"></select>
    </div>
    <div class="row">
      <button class="act" id="pwCopy">复制磁力</button>
      <button class="act" id="pwOpen" onclick="window.open(window.__magnet||'','_blank')">外部打开</button>
    </div>
    <div class="status" id="pwStatus"><span class="spinner"></span>正在连接…</div>
    <div class="diag" id="pwDiag">诊断：初始化中</div>
  </div>
</div>
<script src="preview-app.js"></script>
</body>
</html>
